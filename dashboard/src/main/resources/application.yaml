spring:
  application:
    name: dashboard

  # Config file location
  config:
    import: optional:file:../../../resources/config.yaml

  # DataSource Configuration
  datasource:
    url: jdbc:postgresql://192.168.1.2:5432/thousand_uncles_db
    username: admin
    password: mypassword

  # Spring Web
  web:
    resources:
      static-locations: classpath:/static/

  # Thymeleaf
  thymeleaf:
    cache: false
    mode: HTML

  # Hibernate / JPA Configuration
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # JTA Configuration
  jta:
    enabled: true
