<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>WebSocket Time Updates</title>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.6.1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <style>
        .time-display {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            text-align: center;
            margin: 20px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background-color: #f9f9f9;
        }
        .status {
            text-align: center;
            color: #666;
            margin: 10px;
        }
    </style>
</head>
<body>
<h1>Current Time Updates</h1>

<div class="time-display" id="currentTime">
    Loading current time...
</div>

<div class="status" id="status">
    Connecting...
</div>

<script>
    let stompClient = null;
    let connected = false;

    function connect() {
        const socket = new SockJS('/websocket');
        stompClient = Stomp.over(socket);

        stompClient.connect(function(frame) {
            connected = true;
            console.log('Connected: ' + frame);
            document.getElementById('status').textContent = 'Connected';

            // Subscribe to the time updates topic
            stompClient.subscribe('/topic/current-time', function(message) {
                document.getElementById('currentTime').textContent = message.body;
            });
        }, function(error) {
            console.log('Connection error: ' + error);
            document.getElementById('status').textContent = 'Connection failed';
            // Try to reconnect after 5 seconds
            setTimeout(connect, 5000);
        });
    }

    function disconnect() {
        if (stompClient !== null) {
            stompClient.disconnect();
        }
        connected = false;
        console.log("Disconnected");
    }

    // Start the connection
    connect();

    // Optional: Handle page unload
    window.addEventListener('beforeunload', function() {
        disconnect();
    });
</script>
</body>
</html>
