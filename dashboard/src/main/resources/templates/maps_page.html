<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<div th:switch="${maps}" xmlns:th="http://www.w3.org/1999/xhtml">
    <h2 th:case="null">No users yet!</h2>
    <div th:case="*">
        <h2>Users</h2>
        <table>
            <thead>
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Edit</th>
                <th>Delete</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="map : ${maps}">
                <td th:text="${map.getMapName}"></td>
                <td><a th:href="@{/edit/{id}(id=${map.getId})}">Edit</a></td>
                <td><a th:href="@{/delete/{id}(id=${map.getId})}">Delete</a></td>
            </tr>
            </tbody>
        </table>
    </div>
    <p><a href="/">Add a new user</a></p>
</div>
